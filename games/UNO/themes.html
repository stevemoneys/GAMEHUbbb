<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO - Theme Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body class="themes-screen">
  <div class="themes-shell">
    <header class="themes-header">
      <button id="btn-back" class="back-btn" type="button">Back</button>
      <div class="balance-card">
        <span class="coin-icon" aria-hidden="true"></span>
        <span id="coin-count">1200</span>
      </div>
    </header>

    <section class="themes-title">
      <p class="eyebrow">Theme Shop</p>
      <h1>Customize Your Table</h1>
      <p class="subtitle">Buy background themes and card packs, then switch between them anytime.</p>
    </section>

    <section class="shop-section">
      <div class="section-heading">
        <div>
          <h2>Background Themes</h2>
          <p>Swipe to browse. Locked themes stay blurred until you buy them.</p>
        </div>
      </div>
      <section class="theme-carousel" id="theme-carousel" aria-label="Background theme list"></section>
    </section>

    <section class="shop-section">
      <div class="section-heading">
        <div>
          <h2>Card Pack Themes</h2>
          <p>Two packs per view. Use one to replace the game card backs completely.</p>
        </div>
      </div>
      <section class="theme-carousel theme-carousel--packs" id="card-pack-carousel" aria-label="Card pack theme list"></section>
    </section>
  </div>

  <script src="rewards-core.js"></script>
  <script src="themes-data.js"></script>
  <script src="card-packs-data.js"></script>
  <script src="themes.js"></script>
</body>
</html>
