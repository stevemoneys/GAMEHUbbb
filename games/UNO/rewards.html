<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO - Rewards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="rewards.css">
</head>
<body class="rewards-screen">
  <div class="rewards-shell">
    <header class="rewards-header">
      <button class="back-btn" id="btn-back" type="button">Back</button>
      <div class="balance-card">
        <span class="coin-icon" aria-hidden="true"></span>
        <span id="coin-count">1200</span>
      </div>
    </header>

    <section class="rewards-body">
      <div class="rewards-title">
        <p class="eyebrow">Daily Login Reward</p>
        <h1>Coin Streak Vault</h1>
        <p class="subtitle">Log in daily and keep your streak alive to claim bigger coin payouts.</p>
      </div>

      <div class="daily-panel">
        <div id="daily-reward" class="reward-card reward-card--daily">
          <div class="reward-info">
            <div class="reward-title">Today Reward</div>
            <div id="daily-subtitle" class="reward-subtitle">Day 1 streak</div>
          </div>
          <button id="daily-claim" class="reward-claim-btn reward-claim-btn--daily" type="button">
            <span class="coin-icon" aria-hidden="true"></span>
            <span id="daily-amount">0</span>
            <span class="reward-claim-btn__suffix">Claim</span>
          </button>
        </div>

        <div class="streak-board">
          <h2 class="streak-board__title">7 Day Streak Rewards</h2>
          <div id="daily-schedule" class="streak-track"></div>
        </div>
      </div>

      <h2 class="queue-title">Match Rewards</h2>
      <div id="reward-list" class="reward-list"></div>
      <div id="empty-state" class="empty-state hidden">No unclaimed rewards yet.</div>
    </section>
  </div>

  <div id="coin-fx-layer" class="coin-fx-layer" aria-hidden="true"></div>
  <script src="rewards-core.js"></script>
  <script src="rewards.js"></script>
</body>
</html>
