<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHOT - Card Skins Shop</title>
  <link rel="stylesheet" href="WH.css">
  <link rel="stylesheet" href="themes.css">
</head>
<body class="themes-page">
  <main class="themes-shell">
    <header class="themes-header">
      <a href="WH.html" class="coin-back-btn">Back</a>
      <div class="themes-balance">
        <span class="coin-dot" aria-hidden="true"></span>
        <span id="coin-count">1200</span>
      </div>
    </header>

    <section class="themes-hero">
      <p class="coin-eyebrow">Card Skins Shop</p>
      <h1>Premium Card Collection</h1>
      <p>Buy and equip card skins. The selected skin changes WHOT card backs in gameplay and auto-applies matching front style theme.</p>
    </section>

    <section>
      <h2 class="themes-title">20 Card Skins</h2>
      <div id="skin-grid" class="skin-grid"></div>
    </section>
  </main>

  <script src="js/rewards.js"></script>
  <script src="js/themes-data.js"></script>
  <script src="themes.js"></script>
</body>
</html>
