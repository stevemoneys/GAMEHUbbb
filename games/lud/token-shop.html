<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Skins</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="token-shop.css" />
</head>
<body>
  <div class="rotate-overlay" id="rotate-overlay" aria-hidden="true">
    <div class="rotate-card">
      <div class="rotate-icon" aria-hidden="true">ROTATE</div>
      <h2>Use landscape mode</h2>
      <p>Token shop is optimized for horizontal view.</p>
      <button type="button" id="rotate-try-btn">Try landscape</button>
    </div>
  </div>
  <main class="shop-wrap">
    <header class="shop-head">
      <a class="back-btn" href="index.html" aria-label="Back to lobby">×</a>
      <div class="shop-title"><p class="shop-eyebrow">YOUR COLLECTION</p><h1>Token Collection</h1><p class="collection-count" id="collection-count">0 / 10 COLLECTED</p></div>
      <div class="coin-badge">
        <span class="coin-dot"></span>
        <span id="coin-total">0</span>
      </div>
    </header>
    <section class="loadout" aria-label="Current token loadout">
      <div class="loadout-preview"><img id="loadout-preview" src="tokens/red_result.webp" alt="Current token skin" /></div>
      <div class="loadout-copy"><p class="section-kicker">CURRENTLY EQUIPPED</p><h2 id="loadout-name">Classic Tokens</h2><p id="loadout-state">DEFAULT LOADOUT</p></div>
      <button class="btn use use-default-btn" id="use-default" type="button">Equip Default</button>
    </section>
    <p class="shop-feedback" id="shop-feedback" aria-live="polite"></p>

    <div class="collection-heading"><div><p class="section-kicker">EXPLORE</p><h2>Token Vault</h2></div><p id="collection-page-label">Page 1</p></div>


    <section class="shop-stage">
      <button class="nav-btn" id="prev-btn" type="button">&lt;</button>
      <div class="skin-row" id="skin-row"></div>
      <button class="nav-btn" id="next-btn" type="button">&gt;</button>
    </section>
    <p class="hint" id="hint-text"></p>
  </main>

  <div class="preview-modal" id="preview-modal" hidden>
    <div class="preview-backdrop" data-preview-close></div>
    <section class="preview-sheet" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <button class="preview-close" type="button" data-preview-close aria-label="Close preview">×</button>
      <div class="preview-art"><img id="preview-image" src="tokens/red_result.webp" alt="" /></div>
      <p class="section-kicker" id="preview-series">TOKEN SERIES</p>
      <h2 id="preview-title">Skin</h2>
      <p class="preview-effect" id="preview-effect">COLLECTIBLE TOKEN</p>
      <p class="preview-price" id="preview-price"></p>
      <button class="preview-action" id="preview-action" type="button">UNLOCK</button>
      <button class="preview-secondary" type="button" data-preview-close>CONTINUE BROWSING</button>
    </section>
  </div>

  <div class="unlock-modal" id="unlock-modal" hidden>
    <div class="preview-backdrop"></div>
    <section class="unlock-sheet" role="dialog" aria-modal="true" aria-labelledby="unlock-title">
      <p class="section-kicker">NEW COSMETIC UNLOCKED</p>
      <div class="unlock-art"><img id="unlock-image" src="tokens/red_result.webp" alt="" /></div>
      <h2 id="unlock-title">Skin</h2>
      <p id="unlock-effect"></p>
      <div class="unlock-actions"><button id="unlock-equip" type="button">EQUIP NOW</button><button id="unlock-continue" type="button">CONTINUE</button></div>
    </section>
  </div>

  <script>
    (function () {
      const overlay = document.getElementById("rotate-overlay");
      const tryBtn = document.getElementById("rotate-try-btn");
      function showOverlay() {
        const mobile = window.matchMedia("(max-width: 900px)").matches;
        const landscape = window.matchMedia("(orientation: landscape)").matches;
        const show = false;
        overlay.classList.toggle("show", show);
        overlay.setAttribute("aria-hidden", show ? "false" : "true");
        document.body.classList.toggle("needs-landscape", show);
      }
      async function tryLandscape() {
        try {
          if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          }
        } catch (_) {}
        try {
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape");
          }
        } catch (_) {}
        showOverlay();
      }
      window.addEventListener("resize", showOverlay);
      window.addEventListener("orientationchange", showOverlay);
      document.addEventListener("DOMContentLoaded", showOverlay);
      if (tryBtn) tryBtn.addEventListener("click", tryLandscape);
      setTimeout(showOverlay, 300);
      window.addEventListener("pointerdown", tryLandscape, { once: true });
    })();
  </script>
  <script>
    const TOTAL_SKINS = 10;
    const SKINS_PER_PAGE = 5;
    const PAGE_COUNT = TOTAL_SKINS / SKINS_PER_PAGE;
    const PRICE_MAP = {
      1: 500,
      2: 1000,
      3: 1500,
      4: 2000,
      5: 2500,
      6: 3000,
      7: 3500,
      8: 4000,
      9: 4500,
      10: 5000
    };

    const COINS_KEY = "ludo_coins";
    const OWNED_KEY = "ludo_owned_token_skins";
    const ACTIVE_KEY = "ludo_active_token_skin";

    const coinTotalEl = document.getElementById("coin-total");
    const rowEl = document.getElementById("skin-row");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const hintEl = document.getElementById("hint-text");
    const useDefaultBtn = document.getElementById("use-default");
    const feedbackEl = document.getElementById("shop-feedback");
    const collectionCountEl = document.getElementById("collection-count");
    const loadoutPreviewEl = document.getElementById("loadout-preview");
    const loadoutNameEl = document.getElementById("loadout-name");
    const loadoutStateEl = document.getElementById("loadout-state");
    const collectionPageLabelEl = document.getElementById("collection-page-label");
    const previewModal = document.getElementById("preview-modal");
    const previewImage = document.getElementById("preview-image");
    const previewTitle = document.getElementById("preview-title");
    const previewEffect = document.getElementById("preview-effect");
    const previewPrice = document.getElementById("preview-price");
    const previewAction = document.getElementById("preview-action");
    const unlockModal = document.getElementById("unlock-modal");
    const unlockImage = document.getElementById("unlock-image");
    const unlockTitle = document.getElementById("unlock-title");
    const unlockEffect = document.getElementById("unlock-effect");
    const unlockEquip = document.getElementById("unlock-equip");
    const unlockContinue = document.getElementById("unlock-continue");
    let previewId = null;
    let unlockedId = null;

    let coins = Math.max(0, Number(localStorage.getItem(COINS_KEY) || "0"));
    let owned = [];
    try {
      const parsed = JSON.parse(localStorage.getItem(OWNED_KEY) || "[]");
      owned = Array.isArray(parsed) ? parsed : [];
    } catch {
      owned = [];
    }
    let activeSkin = localStorage.getItem(ACTIVE_KEY) || "classic";
    let currentPage = 0;

    function skinKey(id) {
      return `skin${id}`;
    }

    function skinPrice(id) {
      return PRICE_MAP[id] || 0;
    }

    function saveState() {
      localStorage.setItem(COINS_KEY, String(coins));
      localStorage.setItem(OWNED_KEY, JSON.stringify(owned));
      localStorage.setItem(ACTIVE_KEY, activeSkin);
    }

    function owns(id) {
      return owned.includes(skinKey(id));
    }

    function renderCoins() {
      coinTotalEl.textContent = String(coins);
    }

    function renderCollectionSummary() {
      if (collectionCountEl) collectionCountEl.textContent = `${owned.length} / ${TOTAL_SKINS} COLLECTED`;
      if (collectionPageLabelEl) collectionPageLabelEl.textContent = `PAGE ${currentPage + 1} / ${PAGE_COUNT}`;
      if (loadoutPreviewEl) {
        loadoutPreviewEl.src = activeSkin === "classic" ? "tokens/red_result.webp" : `tokens/skins/${activeSkin}/red_result.webp`;
        loadoutPreviewEl.onerror = () => { loadoutPreviewEl.src = "tokens/red_result.webp"; };
      }
      if (loadoutNameEl) loadoutNameEl.textContent = activeSkin === "classic" ? "Classic Tokens" : `Skin ${activeSkin.replace("skin", "")}`;
      if (loadoutStateEl) loadoutStateEl.textContent = activeSkin === "classic" ? "DEFAULT LOADOUT" : "EQUIPPED ✓";
    }

    function pulseRewards() {
      [coinTotalEl.closest(".coin-badge"), collectionCountEl].forEach((el) => {
        if (!el) return;
        el.classList.remove("coin-pulse", "collection-pulse");
        void el.offsetWidth;
        el.classList.add(el === collectionCountEl ? "collection-pulse" : "coin-pulse");
        setTimeout(() => el.classList.remove("coin-pulse", "collection-pulse"), 620);
      });
    }

    function tokenAsset(id, target) {
      target.src = id === "classic" ? "tokens/red_result.webp" : `tokens/skins/${id}/red_result.webp`;
      target.onerror = () => { target.src = "tokens/red_result.webp"; };
    }

    function closePreview() { if (previewModal) previewModal.hidden = true; previewId = null; }

    function openPreview(id) {
      previewId = id;
      const key = skinKey(id);
      tokenAsset(key, previewImage);
      previewImage.alt = `Token skin ${id} preview`;
      previewTitle.textContent = `Skin ${id}`;
      previewEffect.textContent = "COLLECTIBLE TOKEN";
      previewPrice.textContent = owns(id) ? "OWNED" : `${skinPrice(id)} COINS`;
      previewAction.textContent = owns(id) ? (activeSkin === key ? "EQUIPPED ✓" : "EQUIP") : "UNLOCK";
      previewAction.disabled = activeSkin === key;
      previewModal.hidden = false;
    }

    function showUnlock(id) {
      unlockedId = id;
      tokenAsset(skinKey(id), unlockImage);
      unlockImage.alt = `Unlocked token skin ${id}`;
      unlockTitle.textContent = `Skin ${id}`;
      unlockEffect.textContent = "COLLECTIBLE TOKEN";
      unlockModal.hidden = false;
    }

    function renderNav() {
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === PAGE_COUNT - 1;
      hintEl.textContent = "";
    }

    function announceUnlock(id) {
      if (!feedbackEl) return;
      feedbackEl.textContent = `NEW TOKEN SKIN UNLOCKED — SKIN ${id}`;
      feedbackEl.classList.remove("show");
      void feedbackEl.offsetWidth;
      feedbackEl.classList.add("show");
      setTimeout(() => feedbackEl.classList.remove("show"), 2200);
      showUnlock(id);
    }

    function buildCard(id) {
      const key = skinKey(id);
      const ownedNow = owns(id);
      const inUse = activeSkin === key;
      const price = skinPrice(id);

      const card = document.createElement("article");
      card.className = "skin-card";
      card.dataset.skinKey = key;
      if (!ownedNow && coins >= price) card.classList.add("affordable");

      const previewWrap = document.createElement("div");
      previewWrap.className = "skin-art";
      const preview = document.createElement("img");
      preview.className = "skin-preview";
      preview.src = `tokens/skins/${key}/red_result.webp`;
      preview.alt = `Token skin ${id}`;
      preview.onerror = () => {
        preview.src = "tokens/red_result.webp";
      };

      const title = document.createElement("h3");
      title.textContent = `Skin ${id}`;

      const buyBtn = document.createElement("button");
      buyBtn.type = "button";
      buyBtn.className = "btn buy";
      buyBtn.textContent = ownedNow ? "OWNED ✓" : "UNLOCK";

      const useBtn = document.createElement("button");
      useBtn.type = "button";
      useBtn.className = "btn use";
      useBtn.textContent = inUse ? "EQUIPPED ✓" : "EQUIP";

      const priceLabel = document.createElement("p");
      priceLabel.className = "price";
      priceLabel.innerHTML = `<span class="price-coin"></span><span>${price}</span>`;

      if (ownedNow) {
        buyBtn.disabled = true;
        buyBtn.classList.add("owned");
      } else if (coins < price) {
        buyBtn.disabled = true;
      }

      if (!ownedNow) {
        useBtn.disabled = true;
      }
      if (inUse) {
        useBtn.disabled = true;
        useBtn.classList.add("active");
      }

      buyBtn.addEventListener("click", () => {
        if (owns(id)) return;
        if (coins < price) return;
        coins -= price;
        owned.push(key);
        saveState();
        render();
        pulseRewards();
        rowEl.querySelector(`[data-skin-key="${key}"]`)?.classList.add("newly-unlocked");
        announceUnlock(id);
      });

      useBtn.addEventListener("click", () => {
        if (!owns(id)) return;
        activeSkin = key;
        saveState();
        render();
      });

      card.addEventListener("click", () => openPreview(id));
      buyBtn.addEventListener("click", (event) => event.stopPropagation());
      useBtn.addEventListener("click", (event) => event.stopPropagation());

      previewWrap.appendChild(preview);
      card.appendChild(previewWrap);
      const cardCopy = document.createElement("div");
      cardCopy.className = "skin-copy";
      cardCopy.appendChild(title);
      card.appendChild(cardCopy);
      card.appendChild(buyBtn);
      card.appendChild(useBtn);
      card.appendChild(priceLabel);
      return card;
    }

    function render() {
      renderCoins();
      renderCollectionSummary();
      rowEl.innerHTML = "";
      const start = currentPage * SKINS_PER_PAGE + 1;
      const end = start + SKINS_PER_PAGE - 1;
      for (let id = start; id <= end; id++) {
        rowEl.appendChild(buildCard(id));
      }
      renderNav();
    }

    useDefaultBtn.addEventListener("click", () => {
      activeSkin = "classic";
      saveState();
      render();
    });

    document.querySelectorAll("[data-preview-close]").forEach((el) => el.addEventListener("click", closePreview));
    previewAction.addEventListener("click", () => {
      if (previewId == null) return;
      const card = rowEl.querySelector(`[data-skin-key="${skinKey(previewId)}"]`);
      const action = card?.querySelector(owns(previewId) ? ".use" : ".buy");
      closePreview();
      action?.click();
    });
    unlockContinue.addEventListener("click", () => { unlockModal.hidden = true; unlockedId = null; });
    unlockEquip.addEventListener("click", () => {
      if (unlockedId == null) return;
      const card = rowEl.querySelector(`[data-skin-key="${skinKey(unlockedId)}"]`);
      card?.querySelector(".use")?.click();
      unlockModal.hidden = true;
      unlockedId = null;
    });

    prevBtn.addEventListener("click", () => {
      if (currentPage === 0) return;
      currentPage -= 1;
      render();
    });

    nextBtn.addEventListener("click", () => {
      if (currentPage >= PAGE_COUNT - 1) return;
      currentPage += 1;
      render();
    });

    render();
  </script>
</body>
</html>
