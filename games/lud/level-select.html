<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Level</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="level-select.css" />
</head>
<body>
  <main class="level-wrap">
    <section class="level-card">
      <header class="level-head">
        <div>
          <p class="journey-eyebrow">PLAYER PROGRESSION</p>
          <h1>Level Journey</h1>
          <p class="sub">Build your run, unlock the next challenge, and keep moving forward.</p>
        </div>
        <a class="close-btn" href="vs-computer.html" aria-label="Back to game modes">×</a>
      </header>

      <section class="progress-summary" aria-label="Level progress">
        <div class="progress-stat">
          <span class="progress-label">PLAY NEXT</span>
          <strong id="current-level-value">1</strong>
        </div>
        <div class="progress-stat">
          <span class="progress-label">NEXT MILESTONE</span>
          <strong id="next-level-value">LEVEL 2</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="level-progress-fill"></span>
        </div>
        <p class="progress-caption" id="level-progress-caption">1 / 60 LEVELS UNLOCKED</p>
        <p class="progress-milestone" id="progress-milestone">STARTER JOURNEY</p>
        <p class="progress-next" id="progress-next">Keep going to reach the next milestone.</p>
      </section>

      <a class="continue-level-btn" id="continue-level-btn" href="#level-grid">CONTINUE LEVEL 1</a>

      <div class="level-grid" id="level-grid" aria-label="Available levels"></div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const players = params.get("players") || "4";
    const human = (params.get("human") || "red").toLowerCase();
    const gm = (params.get("gm") || localStorage.getItem("ludo_game_mode") || "classic").toLowerCase();
    localStorage.setItem("ludo_game_mode", gm);
    const closeBtn = document.querySelector(".close-btn");
    if (closeBtn) {
      const backQuery = new URLSearchParams({
        mode: "vs-computer",
        gm
      });
      closeBtn.href = `vs-computer.html?${backQuery.toString()}`;
    }
    const TOTAL_LEVELS = 60;
    const storageKey = "ludo_unlocked_level";

    let unlocked = Number(localStorage.getItem(storageKey) || "1");
    if (!Number.isFinite(unlocked) || unlocked < 1) unlocked = 1;
    unlocked = Math.min(TOTAL_LEVELS, unlocked);
    localStorage.setItem(storageKey, String(unlocked));

    const currentLevelEl = document.getElementById("current-level-value");
    const nextLevelEl = document.getElementById("next-level-value");
    const progressFillEl = document.getElementById("level-progress-fill");
    const progressCaptionEl = document.getElementById("level-progress-caption");
    const milestoneEl = document.getElementById("progress-milestone");
    const milestoneNames = [
      [10, "STARTER"],
      [20, "RISING"],
      [30, "CHALLENGER"],
      [40, "ADVANCED"],
      [50, "EXPERT"],
      [60, "MASTER"]
    ];
    if (currentLevelEl) currentLevelEl.textContent = String(unlocked);
    if (nextLevelEl) {
      nextLevelEl.textContent = unlocked < TOTAL_LEVELS ? `LEVEL ${unlocked + 1}` : "ALL COMPLETE";
    }
    if (progressFillEl) progressFillEl.style.width = `${(unlocked / TOTAL_LEVELS) * 100}%`;
    if (progressCaptionEl) progressCaptionEl.textContent = `${unlocked} / ${TOTAL_LEVELS} LEVELS UNLOCKED`;
    const nextMilestoneEl = document.getElementById("progress-next");
    const milestone = milestoneNames.find(([level]) => unlocked < level) || milestoneNames[milestoneNames.length - 1];
    if (nextLevelEl) {
      nextLevelEl.textContent = unlocked < TOTAL_LEVELS ? `LEVEL ${milestone[0]}` : "ALL COMPLETE";
    }
    if (milestoneEl) {
      const currentStage = milestoneNames.slice().reverse().find(([level]) => unlocked >= level) || [0, "STARTER"];
      milestoneEl.textContent = `${currentStage[1]} STAGE · ${Math.max(0, milestone[0] - unlocked)} TO ${milestone[1]}`;
    }
    if (nextMilestoneEl) {
      nextMilestoneEl.textContent = unlocked < TOTAL_LEVELS ? `NEXT LANDMARK · LEVEL ${milestone[0]}` : "ALL 60 LEVELS COMPLETE";
    }
    const continueBtn = document.getElementById("continue-level-btn");
    if (continueBtn) continueBtn.textContent = unlocked < TOTAL_LEVELS ? `CONTINUE LEVEL ${String(unlocked).padStart(2, "0")}` : "REPLAY LEVEL 60";

    const grid = document.getElementById("level-grid");

    let teleportStarted = false;

    // Match boot uses this same cache/version.  Preparing this exact critical
    // set here means the visual teleport only starts after the selected match
    // can render with its board, dice, and token artwork already available.
    const MATCH_PRELOAD_CACHE = "ludo-preload-assets-v1";
    const MATCH_PRELOAD_VERSION = "2026-08-28-v47";
    const MATCH_PRELOAD_VERSION_KEY = "ludo_preload_manifest_version";
    const MATCH_PRELOAD_UPDATED_AT_KEY = "ludo_preload_updated_at";

    function getOwnedSkin(key, prefix, max) {
      const active = (localStorage.getItem(key) || "classic").trim();
      if (active === "classic") return "classic";
      const match = active.match(new RegExp(`^${prefix}(\\d+)$`));
      if (!match) return "classic";
      const index = Number(match[1]);
      if (!Number.isInteger(index) || index < 1 || index > max) return "classic";
      try {
        const ownershipKey = key === "ludo_active_dice_skin"
          ? "ludo_owned_dice_skins"
          : "ludo_owned_token_skins";
        const owned = JSON.parse(localStorage.getItem(ownershipKey) || "[]");
        return Array.isArray(owned) && owned.includes(active) ? active : "classic";
      } catch {
        return "classic";
      }
    }

    function getMatchAssetList(url) {
      const target = new URL(url, window.location.href);
      const targetPlayers = Math.min(4, Math.max(2, Number(target.searchParams.get("players")) || 4));
      const targetHuman = (target.searchParams.get("human") || "red").toLowerCase();
      const colors = ["red", "green", "yellow", "blue"];
      const humanIndex = Math.max(0, colors.indexOf(targetHuman));
      const activeColors = targetPlayers === 2
        ? [colors[humanIndex], colors[(humanIndex + 2) % colors.length]]
        : Array.from({ length: targetPlayers }, (_, index) => colors[(humanIndex + index) % colors.length]);
      const diceSkin = getOwnedSkin("ludo_active_dice_skin", "skin", 20);
      const tokenSkin = getOwnedSkin("ludo_active_token_skin", "skin", 10);
      const diceFaces = ["1_result.webp", "2_result.webp", "3_result.webp", "4_result.webp", "5_result.webp", "6_result.webp"];
      const skinDiceFaces = ["1_result.webp", "4_result.webp", "6_result.webp", "3_result.webp", "2_result.webp", "5_result.webp"];
      const tokenAssets = (skin) => activeColors.map(color => skin === "classic"
        ? `./tokens/${color}_result.webp`
        : `./tokens/skins/${skin}/${color}_result.webp`);

      return Array.from(new Set([
        "./ludo.html", "./ludo.css", "./design-tokens.css", "./boot.js",
        "./game.js", "./board.js", "./movement.js", "./ai.js",
        "./backgrounds/bg1_result.webp",
        ...diceFaces.map(face => `./dice/${face}`),
        ...(diceSkin === "classic" ? diceFaces : skinDiceFaces).map(face => diceSkin === "classic" ? `./dice/${face}` : `./dice/skins/${diceSkin}/${face}`),
        ...tokenAssets(tokenSkin),
        ...tokenAssets("classic")
      ]));
    }

    async function prepareMatchAssets(url) {
      const assets = getMatchAssetList(url);
      let cache = null;
      if ("caches" in window) cache = await caches.open(MATCH_PRELOAD_CACHE);

      const results = await Promise.allSettled(assets.map(async asset => {
        const request = new Request(asset, { method: "GET", credentials: "same-origin" });
        const cached = cache ? await cache.match(request) : null;
        try {
          // Stable filenames may contain new deployment content. Revalidate
          // while online, but retain the warmed response when offline.
          const response = await fetch(request, { cache: "no-cache" });
          if (!response.ok) throw new Error(`Unable to load ${asset}`);
          if (cache) await cache.put(request, response.clone());
        } catch (error) {
          if (cached) return;
          throw error;
        }
      }));
      const failures = results.filter(result => result.status === "rejected");
      if (failures.length) throw new Error("Critical match assets could not be prepared.");

      localStorage.setItem(MATCH_PRELOAD_VERSION_KEY, MATCH_PRELOAD_VERSION);
      localStorage.setItem(MATCH_PRELOAD_UPDATED_AT_KEY, String(Date.now()));
    }

    function setLevelControlsBusy(isBusy) {
      document.querySelectorAll(".level-btn, .continue-level-btn").forEach(control => {
        control.setAttribute("aria-disabled", isBusy ? "true" : "false");
        if (control instanceof HTMLButtonElement) control.disabled = isBusy || control.classList.contains("locked");
      });
    }

    function showAssetPreparation(level) {
      const overlay = document.createElement("div");
      overlay.className = "asset-prep-overlay";
      overlay.setAttribute("role", "status");
      overlay.setAttribute("aria-live", "polite");
      overlay.innerHTML = `<span class="asset-prep-spinner" aria-hidden="true"></span><strong>PREPARING LEVEL ${String(level).padStart(2, "0")}</strong><span>Loading match assets</span>`;
      document.body.appendChild(overlay);
      return overlay;
    }

    async function startTeleport(url, sourceEl, level) {
      if (teleportStarted || !url) return;
      teleportStarted = true;

      document.documentElement.setAttribute("aria-busy", "true");
      setLevelControlsBusy(true);
      const preparation = showAssetPreparation(level);
      try {
        await prepareMatchAssets(url);
      } catch (error) {
        console.warn("Match asset preparation failed.", error);
        preparation.remove();
        document.documentElement.removeAttribute("aria-busy");
        setLevelControlsBusy(false);
        teleportStarted = false;
        sourceEl?.classList.add("asset-prep-failed");
        window.setTimeout(() => sourceEl?.classList.remove("asset-prep-failed"), 900);
        return;
      }
      preparation.remove();

      try {
        sessionStorage.setItem("ludo_teleport_arrival_v1", "1");
      } catch {
        // The transition remains safe if storage is unavailable.
      }

      const sourceRect = sourceEl?.getBoundingClientRect?.();
      const originX = sourceRect ? sourceRect.left + sourceRect.width / 2 : window.innerWidth / 2;
      const originY = sourceRect ? sourceRect.top + sourceRect.height / 2 : window.innerHeight / 2;
      const reducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
      const duration = reducedMotion ? 320 : 1540;

      sourceEl?.classList.add("teleport-source", "teleport-selected");
      document.body.classList.add("teleporting");

      const overlay = document.createElement("div");
      overlay.className = `teleport-overlay${reducedMotion ? " reduced-motion" : ""}`;
      overlay.setAttribute("aria-hidden", "true");
      overlay.style.setProperty("--portal-origin-x", `${originX}px`);
      overlay.style.setProperty("--portal-origin-y", `${originY}px`);
      overlay.innerHTML = `
        <div class="teleport-backdrop"></div>
        <div class="teleport-portal" aria-hidden="true">
          <span class="portal-field"></span>
          <span class="portal-ring portal-ring-a"></span>
          <span class="portal-ring portal-ring-b"></span>
          <span class="portal-ring portal-ring-c"></span>
          <span class="portal-cross portal-cross-a"></span>
          <span class="portal-cross portal-cross-b"></span>
          <span class="portal-core"></span>
          <span class="portal-particle particle-a"></span>
          <span class="portal-particle particle-b"></span>
          <span class="portal-particle particle-c"></span>
          <span class="portal-particle particle-d"></span>
        </div>
        <div class="teleport-caption">ENTERING LEVEL ${String(level).padStart(2, "0")}</div>
      `;
      document.body.appendChild(overlay);

      requestAnimationFrame(() => overlay.classList.add("teleport-build"));
      window.setTimeout(() => overlay.classList.add("teleport-center"), reducedMotion ? 40 : 620);
      window.setTimeout(() => overlay.classList.add("teleport-arrival"), reducedMotion ? 140 : 1080);
      window.setTimeout(() => {
        overlay.classList.add("teleport-exit");
        overlay.style.pointerEvents = "none";
      }, reducedMotion ? 200 : 1350);
      window.setTimeout(() => {
        overlay.remove();
        document.documentElement.removeAttribute("aria-busy");
        window.location.href = url;
      }, duration);
    }

    for (let level = 1; level <= TOTAL_LEVELS; level++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "level-btn";
      btn.innerHTML = `<span class="level-number">${String(level).padStart(2, "0")}</span><span class="level-label">LEVEL</span>`;
      btn.dataset.level = String(level);

      const isUnlocked = level <= unlocked;
      const isCompleted = level < unlocked;
      const isMilestone = milestoneNames.some(([milestoneLevel]) => milestoneLevel === level);
      if (isCompleted) btn.classList.add("completed");
      if (level === unlocked) btn.classList.add("current");
      if (isMilestone) btn.classList.add("milestone");
      if (level === unlocked && unlocked > 1) btn.classList.add("newly-unlocked");
      if (!isUnlocked) {
        btn.disabled = true;
        btn.classList.add("locked");
        btn.setAttribute("aria-label", `Level ${level}, locked. Complete level ${level - 1} first.`);
      } else if (level === unlocked) {
        btn.setAttribute("aria-label", `Current highest unlocked level, level ${level}`);
        btn.setAttribute("aria-current", "step");
      } else {
        btn.setAttribute("aria-label", `Completed level ${level}`);
      }

      btn.addEventListener("click", () => {
        if (!isUnlocked) return;
        const query = new URLSearchParams({
          mode: "vs-computer",
          players,
          human,
          gm,
          level: String(level)
        });
        startTeleport(`ludo.html?${query.toString()}`, btn, level);
      });

      grid.appendChild(btn);
    }

    if (continueBtn) {
      continueBtn.href = `ludo.html?${new URLSearchParams({
        mode: "vs-computer",
        players,
        human,
        gm,
        level: String(unlocked)
      }).toString()}`;
      continueBtn.addEventListener("click", event => {
        event.preventDefault();
        startTeleport(continueBtn.href, continueBtn, unlocked);
      });
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
          .then(registration => registration.update())
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
