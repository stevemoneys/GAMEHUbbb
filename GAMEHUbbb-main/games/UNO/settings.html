<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body class="settings-screen">
  <div class="settings-shell">
    <header class="settings-header">
      <button id="btn-back" class="back-btn" type="button">Back</button>
      <div>
        <p class="eyebrow">Settings</p>
        <h1>Game Controls</h1>
      </div>
    </header>

    <section class="settings-list">
      <article class="setting-card">
        <div>
          <h2>Background Music</h2>
          <p>Turn the gameplay music loop on or off.</p>
        </div>
        <button type="button" class="setting-toggle" data-setting="music">ON</button>
      </article>

      <article class="setting-card">
        <div>
          <h2>Sound Effects</h2>
          <p>Controls card, UNO, action, win, and reward sounds.</p>
        </div>
        <button type="button" class="setting-toggle" data-setting="sfx">ON</button>
      </article>

      <article class="setting-card">
        <div>
          <h2>Reactions</h2>
          <p>Show or hide the emoji reactions during gameplay.</p>
        </div>
        <button type="button" class="setting-toggle" data-setting="reactions">ON</button>
      </article>

      <article class="setting-card">
        <div>
          <h2>Speech Bubbles</h2>
          <p>Show or hide the talking bubbles that appear during matches.</p>
        </div>
        <button type="button" class="setting-toggle" data-setting="speech">ON</button>
      </article>
    </section>
  </div>

  <script src="settings.js"></script>
</body>
</html>
